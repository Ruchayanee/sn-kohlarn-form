<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>แจ้งโอนเงิน - SN Kohlarn</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f7f9fc; color: #333; text-align: center; padding: 20px; }
        .container { background-color: #fff; border: 1px solid #ddd; padding: 30px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); min-height: 400px; display: flex; flex-direction: column; justify-content: center; }
        h2 { color: #001F3F; margin-top: 0; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; font-family: 'Kanit', sans-serif; font-size: 16px; }
        
        /* ปุ่มหลัก */
        #btnSubmit { background-color: #001F3F; color: #fff; font-weight: bold; cursor: pointer; border: none; }
        #btnSubmit:hover { background-color: #003366; }
        
        /* ปุ่มปิดหน้านี้ */
        #btnClose { background-color: #28a745; color: #fff; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; }
        #btnClose:hover { background-color: #218838; }

        .loading { display: none; color: #001F3F; margin-top: 10px; }
        
        /* สไตล์หน้าจอสำเร็จ */
        #success-section { display: none; }
        .success-icon { font-size: 80px; color: #28a745; margin-bottom: 10px; animation: scaleUp 0.5s ease-out; }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- ส่วนที่ 1: หน้าฟอร์มกรอกข้อมูล -->
        <div id="form-section">
            <h2 id="welcome">ยืนยันการจองห้องพัก</h2>
            <p style="color: #666; margin-bottom: 20px;">กรุณาแนบหลักฐานการโอนเงินเพื่อยืนยัน</p> 
            
            <input type="text" id="custName" placeholder="ชื่อ-นามสกุล หรือ ชื่อที่ใช้จอง">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์ติดต่อ">
            
            <div style="text-align: left; margin-top: 10px; font-size: 14px; color: #888;">แนบรูปสลิปโอนเงิน:</div>
            <input type="file" id="fileInput" accept="image/*">
            
            <button onclick="submitData()" id="btnSubmit">ส่งหลักฐานการโอนเงิน</button>
            
            <div id="loader" class="loading">
                <div style="margin-bottom: 5px; font-weight: bold;">กำลังบันทึกข้อมูล...</div>
                <small>กรุณารอสักครู่ ระบบกำลังอัปโหลดรูปภาพ</small>
            </div>
        </div>

        <!-- ส่วนที่ 2: หน้าจอเมื่อส่งสำเร็จ (เด้งมาหน้านี้แทน) -->
        <div id="success-section">
            <div class="success-icon">✅</div>
            <h2 style="color: #28a745;">ยืนยันการโอนสำเร็จ</h2>
            <p>ระบบได้รับข้อมูลเรียบร้อยแล้วครับ<br>ขอบคุณที่ใช้บริการ <b>SN Kohlarn</b></p>
            
            <button onclick="liff.closeWindow()" id="btnClose">ปิดหน้านี้</button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        let lineName = "ลูกค้า";
        let userId = "ไม่มีข้อมูล";

        // 🚨 ตรวจสอบลิงก์ GAS ของคุณทนายอีกครั้งนะครับ 🚨
        const LIFF_ID = "2009967777-0DZ3XlPg"; 
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLFO7dgjgdeDY5ETh7B_mV-bJG8T_tHnw-a41sOTfw9EKCoknUv2MJ2CP9yVJtL9CbfA/exec"; 

        window.onload = function() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        lineName = profile.displayName;
                        userId = profile.userId;
                        document.getElementById("welcome").innerText = "สวัสดีคุณ " + lineName;
                    });
                } else {
                    liff.login();
                }
            });
        };

        function submitData() {
            const fileInput = document.getElementById("fileInput").files[0];
            const custName = document.getElementById("custName").value;
            const phone = document.getElementById("phone").value;

            if (!fileInput || !custName || !phone) {
                alert("กรุณากรอกข้อมูลและแนบรูปสลิปให้ครบถ้วนนะครับ");
                return;
            }

            // ซ่อนปุ่มเดิมและแสดง Loading
            document.getElementById("btnSubmit").style.display = "none";
            document.getElementById("loader").style.display = "block";

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = {
                    fileData: e.target.result.split(",")[1],
                    mimeType: fileInput.type,
                    custName: custName,
                    phone: phone,
                    lineName: lineName,
                    userId: userId
                };
                
                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(res => {
                    if(res.status === "success") {
                        // 🎯 เด้งไปหน้าจอสำเร็จ
                        showSuccessScreen();
                    } else {
                        alert("พบข้อผิดพลาด: " + res.message);
                        resetButton();
                    }
                })
                .catch(err => {
                    alert("ระบบขัดข้องชั่วคราว กรุณาลองใหม่อีกครั้งครับ");
                    resetButton();
                });
            };
            reader.readAsDataURL(fileInput);
        }

        function showSuccessScreen() {
            document.getElementById("form-section").style.display = "none";
            document.getElementById("success-section").style.display = "block";
        }

        function resetButton() {
            document.getElementById("btnSubmit").style.display = "block";
            document.getElementById("loader").style.display = "none";
        }
    </script>
</body>
</html>
