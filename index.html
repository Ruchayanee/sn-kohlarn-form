<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>แจ้งโอนเงิน - SN Kohlarn</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f7f9fc; color: #333; text-align: center; padding: 20px; }
        .container { background-color: #fff; border: 1px solid #ddd; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); min-height: 350px; display: flex; flex-direction: column; justify-content: center; }
        h2 { color: #001F3F; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        button { background-color: #001F3F; color: #fff; font-weight: bold; cursor: pointer; border: none; font-size: 16px; }
        button:hover { background-color: #003366; }
        .loading { display: none; color: #001F3F; margin-top: 10px; }
        
        .success-screen { display: none; }
        .success-icon { font-size: 60px; color: #28a745; margin-bottom: 15px; }
        #btnClose { background-color: #28a745; margin-top: 20px; font-size: 18px; }
        #btnClose:hover { background-color: #218838; }
        .timer-text { font-size: 13px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ส่วนที่ 1: หน้าฟอร์ม -->
        <div id="form-section">
            <h2 id="welcome">ยืนยันการจองห้องพัก</h2>
            <p>กรุณาแนบหลักฐานการโอนเงินเพื่อยืนยัน (V.9)</p> 
            
            <input type="text" id="custName" placeholder="ชื่อ-นามสกุล หรือ ชื่อที่ใช้จอง">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์ติดต่อ">
            
            <div style="text-align: left; margin-top: 10px; font-size: 14px; color: #666;">แนบสลิปโอนเงิน:</div>
            <input type="file" id="fileInput" accept="image/*">
            
            <button onclick="submitData()" id="btnSubmit">ส่งหลักฐานการโอน</button>
            <div id="loader" class="loading">
                <div style="margin-bottom: 5px;">กำลังส่งข้อมูล...</div>
                <small>กรุณาอย่าเพิ่งปิดหน้าต่างนี้นะครับ</small>
            </div>
        </div>

        <!-- ส่วนที่ 2: หน้าจอเมื่อส่งสำเร็จ (แก้ไขใหม่) -->
        <div id="success-section" class="success-screen">
            <div class="success-icon">✅</div>
            <h2>ส่งข้อมูลเรียบร้อย!</h2>
            <p>ขอบคุณคุณ <span id="display-name"></span> มากครับ<br>แอดมินจะรีบตรวจสอบข้อมูลให้ครับ</p>
            
            <!-- เพิ่มปุ่มปิดแบบแมนนวล เพื่อแก้ปัญหา iOS ค้าง -->
            <button onclick="closeLiff()" id="btnClose">กลับไปที่หน้าแชท</button>
            
            <p class="timer-text">หน้าต่างจะปิดอัตโนมัติใน <span id="countdown">5</span> วินาที</p>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        let lineName = "ลูกค้า";
        let userId = "ไม่มีข้อมูล";

        const LIFF_ID = "2009967777-0DZ3XlPg"; 
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLFO7dgjgdeDY5ETh7B_mV-bJG8T_tHnw-a41sOTfw9EKCoknUv2MJ2CP9yVJtL9CbfA/exec"; 

        window.onload = function() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        lineName = profile.displayName;
                        userId = profile.userId;
                        document.getElementById("welcome").innerText = "สวัสดีคุณ " + lineName;
                        document.getElementById("display-name").innerText = lineName;
                    });
                } else {
                    liff.login();
                }
            });
        };

        function submitData() {
            const fileInput = document.getElementById("fileInput").files[0];
            const custName = document.getElementById("custName").value;
            const phone = document.getElementById("phone").value;

            if (!fileInput || !custName || !phone) {
                alert("กรุณากรอกข้อมูลและแนบรูปสลิปให้ครบถ้วนครับ");
                return;
            }

            document.getElementById("btnSubmit").style.display = "none";
            document.getElementById("loader").style.display = "block";

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = {
                    fileData: e.target.result.split(",")[1],
                    mimeType: fileInput.type,
                    custName: custName,
                    phone: phone,
                    lineName: lineName,
                    userId: userId
                };
                
                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(res => {
                    if(res.status === "success") {
                        showSuccess();
                    } else {
                        alert("พบข้อผิดพลาด: " + res.message);
                        resetForm();
                    }
                })
                .catch(err => {
                    alert("ระบบมีปัญหาชั่วคราว กรุณาลองใหม่อีกครั้งครับ");
                    resetForm();
                });
            };
            reader.readAsDataURL(fileInput);
        }

        function showSuccess() {
            document.getElementById("form-section").style.display = "none";
            document.getElementById("success-section").style.display = "block";

            let count = 5; // เพิ่มเวลาเป็น 5 วินาทีเพื่อให้คนอ่านข้อความทัน
            const timer = setInterval(() => {
                count--;
                document.getElementById("countdown").innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    closeLiff(); // พยายามปิดอัตโนมัติ
                }
            }, 1000);
        }

        // ฟังก์ชันปิดหน้าต่างแยกออกมาต่างหาก
        function closeLiff() {
            if (liff.isInClient()) {
                liff.closeWindow();
            } else {
                // ถ้าเปิดในเบราว์เซอร์ธรรมดา ให้แจ้งเตือนแทน
                alert("กรุณากดปิดหน้าต่างนี้เพื่อกลับไปยัง LINE ครับ");
            }
        }

        function resetForm() {
            document.getElementById("btnSubmit").style.display = "block";
            document.getElementById("loader").style.display = "none";
        }
    </script>
</body>
</html>
