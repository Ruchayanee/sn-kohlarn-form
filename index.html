<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>แจ้งโอนเงิน - SN Kohlarn</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f7f9fc; color: #333; text-align: center; padding: 20px; }
        .container { background-color: #fff; border: 1px solid #ddd; padding: 30px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); min-height: 420px; display: flex; flex-direction: column; justify-content: center; }
        h2 { color: #001F3F; margin-top: 0; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; font-family: 'Kanit', sans-serif; font-size: 16px; }
        
        /* ปุ่มส่งข้อมูล */
        #btnSubmit { background-color: #001F3F; color: #fff; font-weight: bold; cursor: pointer; border: none; }
        #btnSubmit:hover { background-color: #003366; }
        
        /* ปุ่มปิดหน้านี้ (สีเขียวเด่นชัด) */
        #btnClose { background-color: #28a745; color: #fff; font-weight: bold; cursor: pointer; border: none; margin-top: 25px; font-size: 18px; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3); }
        #btnClose:hover { background-color: #218838; }

        .loading { display: none; color: #001F3F; margin-top: 10px; }
        
        /* หน้าจอสำเร็จ */
        #success-section { display: none; }
        .success-icon { font-size: 90px; color: #28a745; margin-bottom: 15px; animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ส่วนที่ 1: หน้าฟอร์มหลัก -->
        <div id="form-section">
            <h2 id="welcome">ยืนยันการจองห้องพัก</h2>
            <p style="color: #666;">กรุณาแนบหลักฐานการโอนเงินเพื่อยืนยัน</p> 
            
            <input type="text" id="custName" placeholder="ชื่อที่ใช้จอง (เช่น คุณสมชาย)">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์">
            
            <div style="text-align: left; margin-top: 10px; font-size: 14px; color: #888;">แนบรูปสลิปโอนเงิน:</div>
            <input type="file" id="fileInput" accept="image/*">
            
            <button onclick="submitData()" id="btnSubmit">ส่งหลักฐานการโอนเงิน</button>
            
            <div id="loader" class="loading">
                <div style="font-weight: bold;">กำลังประมวลผล...</div>
                <small>กรุณาอย่าปิดหน้านี้ ระบบกำลังอัปโหลดรูปภาพ</small>
            </div>
        </div>

        <!-- ส่วนของหน้าจอสำเร็จที่ปรับปรุงใหม่ -->
<div id="success-section">
    <div class="success-icon">✅</div>
    <h2 style="color: #28a745; margin-bottom: 10px;">ยืนยันการโอนสำเร็จ</h2>
    <p style="font-size: 16px; line-height: 1.6;">
        ระบบได้รับข้อมูลของท่านแล้วครับ<br>
        ขอบคุณที่ไว้วางใจพักกับเรา<br>
        <b>SN Kohlarn</b>
    </p>
    
    <button onclick="liff.closeWindow()" id="btnClose">ปิดหน้าต่างนี้</button>
    
    <!-- เพิ่มข้อความแจ้งเตือนลูกค้าเพื่อความสบายใจ -->
    <p style="font-size: 12px; color: #888; margin-top: 10px;">
        *หากมีหน้าต่างถามยืนยัน ให้กด <b>"ตกลง"</b> หรือ <b>"เปิด"</b> นะครับ
    </p>
</div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        let lineName = "ลูกค้า";
        let userId = "ไม่มีข้อมูล";

        const LIFF_ID = "2009967777-0DZ3XlPg"; 
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLFO7dgjgdeDY5ETh7B_mV-bJG8T_tHnw-a41sOTfw9EKCoknUv2MJ2CP9yVJtL9CbfA/exec"; 

        window.onload = function() {
            liff.init({ liffId: LIFF_ID }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        lineName = profile.displayName;
                        userId = profile.userId;
                        document.getElementById("welcome").innerText = "สวัสดีคุณ " + lineName;
                    });
                } else {
                    liff.login();
                }
            });
        };

        function submitData() {
            const fileInput = document.getElementById("fileInput").files[0];
            const custName = document.getElementById("custName").value;
            const phone = document.getElementById("phone").value;

            if (!fileInput || !custName || !phone) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วนก่อนส่งนะครับ");
                return;
            }

            document.getElementById("form-section").style.display = "none";
            document.getElementById("loader").style.display = "block";

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = {
                    fileData: e.target.result.split(",")[1],
                    mimeType: fileInput.type,
                    custName: custName,
                    phone: phone,
                    lineName: lineName,
                    userId: userId
                };
                
                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(res => {
                    if(res.status === "success") {
                        // 🎯 แสดงหน้าจอสำเร็จแบบใหม่
                        document.getElementById("loader").style.display = "none";
                        document.getElementById("success-section").style.display = "block";
                    } else {
                        alert("เกิดข้อผิดพลาด: " + res.message);
                        document.getElementById("form-section").style.display = "block";
                        document.getElementById("loader").style.display = "none";
                    }
                })
                .catch(err => {
                    alert("การเชื่อมต่อขัดข้อง กรุณาลองใหม่อีกครั้งครับ");
                    document.getElementById("form-section").style.display = "block";
                    document.getElementById("loader").style.display = "none";
                });
            };
            reader.readAsDataURL(fileInput);
        }
    </script>
</body>
</html>
